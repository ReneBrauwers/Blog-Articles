<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}">{{ end }}
<style>body{max-width:860px;margin:0 auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#222}img{max-width:100%;height:auto}pre{overflow-x:auto;background:#f5f5f5;padding:.75rem}header a,footer{color:#555}.meta{color:#777;font-size:.9rem}</style>
{{ with site.Params.umamiWebsiteId }}<script defer src="{{ site.Params.umamiScript }}" data-website-id="{{ . }}"></script>{{ end }}
